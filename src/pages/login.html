<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JGS Studio - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 32px;
      color: #333;
      margin-bottom: 5px;
    }

    .logo p {
      color: #999;
      font-size: 14px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 40px;
    }

    .welcome h2 {
      color: #333;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #666;
      font-size: 14px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-owner {
      background-color: #667eea;
      color: white;
    }

    .btn-owner:hover {
      background-color: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-client {
      background-color: #764ba2;
      color: white;
    }

    .btn-client:hover {
      background-color: #653a8a;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
    }

    .divider {
      text-align: center;
      margin: 30px 0;
      color: #999;
    }

    .features {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 5px;
      font-size: 13px;
      color: #666;
    }

    .features h3 {
      color: #333;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .features ul {
      list-style: none;
      padding-left: 0;
    }

    .features li {
      margin-bottom: 8px;
      padding-left: 20px;
      position: relative;
    }

    .features li:before {
      content: '✓';
      position: absolute;
      left: 0;
      color: #667eea;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🎬 JGS</h1>
      <p>Jay Gel Studio</p>
    </div>

    <div class="welcome">
      <h2>Welcome</h2>
      <p>Photography • Films • Memories</p>
    </div>

    <div class="button-group">
      <button class="btn-owner" onclick="goToOwnerLogin()">👤 Owner Login</button>
      <button class="btn-client" onclick="goToClientLogin()">📸 Client Login</button>
    </div>

    <div class="divider">or</div>

    <div class="features">
      <h3>Owner Access</h3>
      <ul>
        <li>Manage all bookings</li>
        <li>Track payments</li>
        <li>Organize gallery</li>
      </ul>
    </div>
  </div>

  <script>
    function goToOwnerLogin() {
      window.location.href = '/auth/owner-login';
    }

    function goToClientLogin() {
      window.location.href = '/auth/client-login';
    }
  </script>
</body>
</html>
